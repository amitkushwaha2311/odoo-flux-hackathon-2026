<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" fill="none">
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="360" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4F8F5"/>
      <stop offset="100%" stop-color="#E8F1EC"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D7A4F"/>
      <stop offset="100%" stop-color="#1F3A27"/>
    </linearGradient>
    <linearGradient id="goldGrad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2D788"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F1D14" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="360" height="180" rx="14" fill="url(#bgGrad4)"/>
  <circle cx="60" cy="140" r="45" fill="#E2EDE6" opacity="0.6"/>
  <circle cx="300" cy="40" r="50" fill="#DCEAE1" opacity="0.5"/>

  <!-- Left: Customer Profile & Security Shield Card -->
  <g filter="url(#shadow4)">
    <rect x="28" y="24" width="138" height="132" rx="10" fill="#FFFFFF" stroke="#E1EBE4" stroke-width="1.2"/>
    
    <!-- User Avatar & Identity -->
    <circle cx="58" cy="54" r="18" fill="url(#avatarGrad)"/>
    <text x="58" y="59" font-family="-apple-system, Inter, sans-serif" font-size="13" font-weight="700" fill="#FDFCFA" text-anchor="middle">AC</text>
    
    <text x="86" y="50" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="700" fill="#172B1E">Acme Corp</text>
    <text x="86" y="64" font-family="-apple-system, Inter, sans-serif" font-size="9" font-weight="500" fill="#7E8C82">Enterprise Tier</text>

    <!-- Tenant Isolation Shield Pill -->
    <rect x="40" y="84" width="114" height="24" rx="12" fill="#E7F3ED" stroke="#2D7A4F" stroke-width="0.8"/>
    <!-- Shield Icon -->
    <path d="M 52 92 L 57 90 L 62 92 C 62 96 57 101 57 101 C 57 101 52 96 52 92 Z" fill="#27845C"/>
    <text x="67" y="100" font-family="-apple-system, Inter, sans-serif" font-size="8" font-weight="700" fill="#27845C">Isolated Commercial Partner</text>

    <!-- Quick Metrics in Card -->
    <line x1="40" y1="118" x2="154" y2="118" stroke="#F1F5F2" stroke-width="1"/>
    <text x="40" y="136" font-family="-apple-system, Inter, sans-serif" font-size="8" font-weight="600" fill="#7E8C82">ACTIVE CONTRACTS</text>
    <text x="146" y="138" font-family="-apple-system, Inter, sans-serif" font-size="13" font-weight="800" fill="#172B1E" text-anchor="end">3</text>
  </g>

  <!-- Right: Self-Service Action Tiles -->
  <!-- 1. Subscription Contract Card -->
  <g filter="url(#shadow4)">
    <rect x="180" y="24" width="152" height="60" rx="8" fill="#FFFFFF" stroke="#E1EBE4" stroke-width="1.2"/>
    <rect x="192" y="36" width="28" height="28" rx="6" fill="#EDF3EC"/>
    <path d="M 200 45 C 200 42, 212 42, 212 45 L 210 54 L 202 54 Z" fill="#2D7A4F"/>
    
    <text x="228" y="44" font-family="-apple-system, Inter, sans-serif" font-size="10" font-weight="700" fill="#172B1E">Cloud Pro Plan</text>
    <text x="228" y="58" font-family="-apple-system, Inter, sans-serif" font-size="9" font-weight="600" fill="#27845C">$450/mo</text>

    <rect x="282" y="34" width="40" height="16" rx="8" fill="#E7F3ED"/>
    <text x="302" y="45" font-family="-apple-system, Inter, sans-serif" font-size="8" font-weight="700" fill="#27845C" text-anchor="middle">ACTIVE</text>
    
    <text x="192" y="74" font-family="-apple-system, Inter, sans-serif" font-size="8" font-weight="500" fill="#7E8C82">Next Renewal: Nov 15, 2026</text>
  </g>

  <!-- 2. Invoice & Statement PDF Download Tile -->
  <g filter="url(#shadow4)">
    <rect x="180" y="96" width="152" height="60" rx="8" fill="#FFFFFF" stroke="#E1EBE4" stroke-width="1.2"/>
    <rect x="192" y="108" width="28" height="28" rx="6" fill="#FCF4E8"/>
    <!-- PDF Document Icon -->
    <path d="M 201 115 H 209 L 213 119 V 129 H 201 Z" fill="#D4AF37"/>
    <text x="207" y="125" font-family="-apple-system, Inter, sans-serif" font-size="6" font-weight="800" fill="#FFFFFF" text-anchor="middle">PDF</text>
    
    <text x="228" y="116" font-family="-apple-system, Inter, sans-serif" font-size="10" font-weight="700" fill="#172B1E">Tax Invoices</text>
    <text x="228" y="128" font-family="-apple-system, Inter, sans-serif" font-size="8" font-weight="500" fill="#7E8C82">Receipt #INV-8921</text>

    <rect x="228" y="136" width="94" height="14" rx="7" fill="#1F3A27"/>
    <text x="275" y="146" font-family="-apple-system, Inter, sans-serif" font-size="7.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Download PDF ↓</text>
  </g>
</svg>
