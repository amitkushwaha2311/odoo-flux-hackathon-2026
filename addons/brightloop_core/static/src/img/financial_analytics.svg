<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" fill="none">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="360" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4F8F5"/>
      <stop offset="100%" stop-color="#E8F1EC"/>
    </linearGradient>
    <linearGradient id="chartAreaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D7A4F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2D7A4F" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D7A4F"/>
      <stop offset="100%" stop-color="#1F3A27"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F1D14" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="360" height="180" rx="14" fill="url(#bgGrad3)"/>
  <circle cx="280" cy="40" r="50" fill="#DCEAE1" opacity="0.6"/>

  <!-- Top Metrics Bar -->
  <g filter="url(#shadow3)">
    <rect x="28" y="20" width="144" height="42" rx="8" fill="#FFFFFF" stroke="#E1EBE4" stroke-width="1.2"/>
    <text x="40" y="36" font-family="-apple-system, Inter, sans-serif" font-size="9" font-weight="600" fill="#7E8C82" letter-spacing="0.5">MONTHLY RUN RATE</text>
    <text x="40" y="54" font-family="-apple-system, Inter, sans-serif" font-size="15" font-weight="800" fill="#172B1E">$84,250</text>
    <rect x="118" y="32" width="46" height="18" rx="9" fill="#E7F3ED"/>
    <text x="141" y="44" font-family="-apple-system, Inter, sans-serif" font-size="9" font-weight="700" fill="#27845C" text-anchor="middle">+18.4%</text>
  </g>

  <g filter="url(#shadow3)">
    <rect x="186" y="20" width="146" height="42" rx="8" fill="#FFFFFF" stroke="#E1EBE4" stroke-width="1.2"/>
    <text x="198" y="36" font-family="-apple-system, Inter, sans-serif" font-size="9" font-weight="600" fill="#7E8C82" letter-spacing="0.5">NET COLLECTION</text>
    <text x="198" y="54" font-family="-apple-system, Inter, sans-serif" font-size="15" font-weight="800" fill="#172B1E">99.4%</text>
    <circle cx="316" cy="41" r="9" fill="#E7F3ED"/>
    <path d="M 312 41 L 315 44 L 320 38" fill="none" stroke="#27845C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main Chart Surface (Bottom) -->
  <g filter="url(#shadow3)">
    <rect x="28" y="72" width="304" height="92" rx="10" fill="#FFFFFF" stroke="#E1EBE4" stroke-width="1.2"/>
    
    <!-- Grid Horizontal Lines -->
    <line x1="42" y1="92" x2="318" y2="92" stroke="#F1F5F2" stroke-width="1"/>
    <line x1="42" y1="116" x2="318" y2="116" stroke="#F1F5F2" stroke-width="1"/>
    <line x1="42" y1="140" x2="318" y2="140" stroke="#E8F1EC" stroke-width="1"/>

    <!-- Revenue Bar Columns (Back Layer) -->
    <rect x="54" y="112" width="16" height="28" rx="2" fill="#E2EDE6"/>
    <rect x="94" y="104" width="16" height="36" rx="2" fill="#E2EDE6"/>
    <rect x="134" y="96" width="16" height="44" rx="2" fill="#E2EDE6"/>
    <rect x="174" y="86" width="16" height="54" rx="2" fill="#DCEAE1"/>
    <rect x="214" y="80" width="16" height="60" rx="2" fill="#CBE0D3"/>
    <rect x="254" y="74" width="16" height="66" rx="2" fill="url(#barGrad)"/>
    <rect x="294" y="68" width="16" height="72" rx="2" fill="#2D7A4F"/>

    <!-- Area Chart Trajectory (Rising Line) -->
    <path d="M 54 116 Q 114 110, 154 94 T 234 82 T 310 66 L 310 140 L 54 140 Z" fill="url(#chartAreaGrad)"/>
    <path d="M 54 116 Q 114 110, 154 94 T 234 82 T 310 66" fill="none" stroke="#2D7A4F" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Key Milestone Dots with Champagne Accents -->
    <circle cx="54" cy="116" r="3.5" fill="#FFFFFF" stroke="#2D7A4F" stroke-width="2"/>
    <circle cx="154" cy="94" r="3.5" fill="#FFFFFF" stroke="#2D7A4F" stroke-width="2"/>
    <circle cx="234" cy="82" r="3.5" fill="#FFFFFF" stroke="#2D7A4F" stroke-width="2"/>
    <circle cx="310" cy="66" r="5" fill="#D4AF37" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Month Labels -->
    <text x="62" y="153" font-family="-apple-system, Inter, sans-serif" font-size="8" font-weight="600" fill="#7E8C82" text-anchor="middle">MAY</text>
    <text x="142" y="153" font-family="-apple-system, Inter, sans-serif" font-size="8" font-weight="600" fill="#7E8C82" text-anchor="middle">JUL</text>
    <text x="222" y="153" font-family="-apple-system, Inter, sans-serif" font-size="8" font-weight="600" fill="#7E8C82" text-anchor="middle">SEP</text>
    <text x="302" y="153" font-family="-apple-system, Inter, sans-serif" font-size="8" font-weight="700" fill="#172B1E" text-anchor="middle">OCT</text>
  </g>
</svg>

