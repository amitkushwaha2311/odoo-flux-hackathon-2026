; =============================================================================
; Brightloop — Odoo 20.0 Configuration
; Mounted into the Odoo container at /etc/odoo/odoo.conf (read-only)
;
; Environment variable substitution is handled by Docker Compose .env file.
; Credentials are NOT stored here — they arrive via Docker environment vars.
; =============================================================================

[options]

; ---------------------------------------------------------------------------
; Database connection
; Credentials are injected by the Docker entrypoint via HOST/PORT/USER/PASSWORD
; environment variables. Do NOT set db_user or db_password here — the
; entrypoint patches them at container startup from the env vars.
; ---------------------------------------------------------------------------
db_host = db
db_port = 5432

; Prefix filter — only show databases starting with this prefix.
; Keeps the database list clean in multi-db development.
dbfilter = ^brightloop

; ---------------------------------------------------------------------------
; Addon paths
; /mnt/extra-addons is the volume-mounted ./addons directory.
; /usr/lib/python3/dist-packages/odoo/addons is the built-in Odoo addons path.
; ---------------------------------------------------------------------------
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; ---------------------------------------------------------------------------
; Server configuration
; ---------------------------------------------------------------------------
; Interface — listen on 0.0.0.0 inside the container so Docker port mapping works
http_interface = 0.0.0.0
http_port = 8069
gevent_port = 8072

; Number of worker processes (0 = threaded mode, suitable for development)
workers = 0

; ---------------------------------------------------------------------------
; Logging
; ---------------------------------------------------------------------------
logfile = /var/log/odoo/odoo.log
log_level = info
log_handler = :INFO

; ---------------------------------------------------------------------------
; Security
; ---------------------------------------------------------------------------
; Master password is set via the ODOO_MASTER_PASSWORD env var at runtime,
; not hardcoded here.

; Limit the number of records that can be exported at once.
limit_time_cpu = 60
limit_time_real = 120
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560

; ---------------------------------------------------------------------------
; Development
; ---------------------------------------------------------------------------
; Uncomment to enable asset development mode. Do NOT enable in production.
; dev_mode = assets

; Disable test mode in normal operation.
test_enable = False

